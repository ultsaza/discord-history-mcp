[project]
name = "discord-history-mcp"
version = "0.1.0"
description = "Shared Discord history MCP with per-member permissions and Discord-based OAuth approval"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "discord-history-mcp contributors"}]
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1", "uvicorn>=0.35,<1", "discord.py>=2.6,<3"]

[project.urls]
Repository = "https://github.com/ultsaza/discord-history-mcp"
Issues = "https://github.com/ultsaza/discord-history-mcp/issues"

[project.scripts]
discord-history-mcp = "discord_history_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip-audit>=2.10,<3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
